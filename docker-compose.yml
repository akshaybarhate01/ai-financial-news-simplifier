version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Container
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: finnews_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_news
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_news"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # FastAPI Application Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: finnews_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://postgres:postgrespassword2026@postgres:5432/financial_news
      SECRET_KEY: ${SECRET_KEY:-financial-news-simplifier-super-secret-jwt-key-2026-production}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: llama-3.3-70b-versatile
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      PORT: 8000
    ports:
      - "8000:8000"

  # ----------------------------------------------------------------------------
  # React + Nginx Production Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: finnews_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
